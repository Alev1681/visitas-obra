<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: https://viacep.com.br https://nominatim.openstreetmap.org; frame-src https://maps.google.com https://www.google.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#024089">
  <!-- O app só tem tema claro: impede o "modo escuro automático" do Chrome/Android de recolorir as cores da marca -->
  <meta name="color-scheme" content="only light">
  <meta name="description" content="Registro de visitas a obras: contatos, endereço, GPS, fotos e material de marketing.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Visitas">
  <title>Visitas de Obra</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-back" class="icon-btn" type="button" aria-label="Voltar" hidden></button>
    <span class="brand-dot" id="brand-dot" aria-hidden="true"></span>
    <h1 id="title">Visitas de Obra</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
